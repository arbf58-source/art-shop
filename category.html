<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محصولات</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 30px 20px;
            margin: 0;
            direction: rtl;
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #2c3e50; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .product-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .product-info h3 { margin: 0 0 10px 0; font-size: 18px; color: #333; }
        .product-code {
            font-size: 14px;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 15px;
        }
        .phone-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            text-align: center;
        }
        .order-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .order-btn:hover { background-color: #1ebe57; }
    </style>
</head>
<body>

    <header>
        <h1 id="category-title">لیست محصولات</h1>
    </header>

    <div class="products-grid" id="product-container">
        <!-- محصولات به صورت خودکار اینجا قرار می‌گیرند -->
    </div>

    <script>
        // خواندن کد دسته‌بندی از آدرس صفحه
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('cat');
        
        const titleElement = document.getElementById('category-title');
        const container = document.getElementById('product-container');

        // بانک اطلاعاتی محصولات شما (عکس‌ها و نام‌ها را می‌توانید تغییر دهید)
        const storeData = {
            necklaces: {
                title: "مجموعه گردنبندها",
                items: [
                    { name: "گردنبند مروارید کلاسیک", code: "NK-01", img: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=500" },
                    { name: "گردنبند نقره نگین‌دار", code: "NK-02", img: "https://images.unsplash.com/photo-1611591967282-3d84f885a4a5?w=500" }
                ]
            },
            bracelets: {
                title: "مجموعه دستبندها",
                items: [
                    { name: "دستبند چرم دست‌ساز", code: "BR-01", img: "https://images.unsplash.com/photo-1611591967215-cd81881cf46f?w=500" },
                    { name: "دستبند کارتیر طلا", code: "BR-02", img: "https://images.unsplash.com/photo-1573408301185-9146fe634ad0?w=500" }
                ]
            },
            rings: {
                title: "مجموعه انگشترها",
                items: [
                    { name: "انگشتر نامزدی جواهر", code: "RG-01", img: "https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=500" }
                ]
            }
        };

        const selectedCategory = storeData[category];

        if (selectedCategory) {
            titleElement.innerText = selectedCategory.title;
            
            selectedCategory.items.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <img src="${product.img}" alt="${product.name}" class="product-img">
                        <div class="product-info">
                            <h3>${product.name}</h3>
                            <div class="product-code">کد محصول: ${product.code}</div>
                        </div>
                    </div>
                    <div>
                        <input type="tel" placeholder="شماره موبایل خریدار" class="phone-input" id="phone-${index}">
                        <button class="order-btn" onclick="sendToWhatsApp('${product.name}', '${product.code}', 'phone-${index}')">ثبت سفارش</button>
                    </div>
                `;
                container.appendChild(card);
            });
        } else {
            titleElement.innerText = "دسته‌بندی پیدا نشد";
        }

        // تابع ارسال پیام به واتس‌اپ
        function sendToWhatsApp(productName, productCode, inputId) {
            const customerPhone = document.getElementById(inputId).value.trim();
            
            if (!customerPhone) {
                alert("لطفاً ابتدا شماره تماس خود را وارد کنید.");
                return;
            }

            // شماره شما با کد ۹۸ و بدون صفر اول
            const merchantWhatsApp = "98930102009";
            
            // متن پیام نهایی
            const message = `سلام، وقت بخیر.\nسفارش جدید دارم:\n\n📦 محصول: ${productName}\n🔖 کد: ${productCode}\n📞 شماره تماس مشتری: ${customerPhone}`;
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${merchantWhatsApp}?text=${encodedMessage}`, '_blank');
        }
    </script>

</body>
</html>
