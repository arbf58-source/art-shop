<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری زیورآلات لوتوس</title>
    <style>
        :root {
            --primary-gold: #c5a059;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary-gold);
        }
        h1 {
            color: var(--primary-gold);
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .product-card h3 {
            color: var(--primary-gold);
        }
        .btn {
            background-color: var(--primary-gold);
            color: #000;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #d4af37;
        }
    </style>
</head>
<body>

    <header>
        <h1>گالری زیورآلات لوتوس</h1>
        <p>فروشگاه آنلاین لوکس‌ترین بدلیجات و لوازم زینتی</p>
    </header>

    <div class="container">
        <h2>محصولات پرطرفدار</h2>
        <div class="products-grid">
            <div class="product-card">
                <h3>گردنبند طلاپوش</h3>
                <p>عیار بالا و ضد حساسیت</p>
                <p><strong>۴۵۰,۰۰۰ تومان</strong></p>
                <button class="btn" onclick="alert('محصول به سبد خرید اضافه شد!')">افزودن به سبد خرید</button>
            </div>
            <div class="product-card">
                <h3>دستبند نگین‌دار</h3>
                <p>طراوت و زیبایی مدرن</p>
                <p><strong>۳۲۰,۰۰۰ تومان</strong></p>
                <button class="btn" onclick="alert('محصول به سبد خرید اضافه شد!')">افزودن به سبد خرید</button>
            </div>
            <div class="product-card">
                <h3>گوشواره مجلسی</h3>
                <p>طرح سلطنتی و شیک</p>
                <p><strong>۲۸۰,۰۰۰ تومان</strong></p>
                <button class="btn" onclick="alert('محصول به سبد خرید اضافه شد!')">افزودن به سبد خرید</button>
            </div>
        </div>
    </div>

</body>
</html>
