<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه آنلاین</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            direction: rtl;
        }
        h1 { color: #333; margin-bottom: 40px; }
        .categories-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .category-card {
            background: white;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #2c3e50;
            font-size: 20px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <h1>دسته‌بندی محصولات</h1>

    <div class="categories-grid">
        <!-- برای اضافه کردن دسته‌بندی جدید، آدرس 'cat' را تغییر دهید -->
        <a href="category.html?cat=necklaces" class="category-card">
            ✨ گردنبندها
        </a>
        <a href="category.html?cat=bracelets" class="category-card">
            💎 دستبندها
        </a>
        <a href="category.html?cat=rings" class="category-card">
            💍 انگشترها
        </a>
    </div>

</body>
</html>
