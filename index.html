<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دسته‌بندی محصولات</title>
    <style>
        body { font-family: Tahoma, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; text-align: right; }
        header { background-color: #333; color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; }
        nav ul li { position: relative; margin-right: 20px; }
        nav ul li a { color: #fff; text-decoration: none; padding: 10px; display: block; }
        .dropdown-content { display: none; position: absolute; background-color: #444; min-width: 160px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 1; right: 0; }
        .dropdown-content a { color: #fff; padding: 12px 16px; text-decoration: none; display: block; }
        .dropdown-content a:hover { background-color: #555; }
        nav ul li:hover .dropdown-content { display: block; }
        
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .section { display: none; margin-bottom: 40px; }
        .section.active { display: block; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: flex-start; }
        .card { background: #fff; border: 1px solid #ddd; padding: 15px; width: 220px; text-align: center; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { max-width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
        h2 { border-bottom: 2px solid #ccc; padding-bottom: 10px; color: #333; }
    </style>
</head>
<body>

    <header>
        <h2>فروشگاه ما</h2>
        <nav>
            <ul>
                <li><a href="index.html">صفحه اصلی</a></li>
                <li>
                    <a href="category.html">دسته‌بندی‌ها ▾</a>
                    <div class="dropdown-content">
                        <a href="category.html?cat=keychain" onclick="showCategory('keychain')">جاکلیدی و آویز کیف</a>
                        <a href="category.html?cat=earring" onclick="showCategory('earring')">گوشواره</a>
                    </div>
                </li>
                <li><a href="#">درباره ما</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <!-- بخش جاکلیدی و آویز کیف -->
        <div id="keychain-section" class="section">
            <h2>جاکلیدی و آویز کیف</h2>
            <div class="grid">
                <div class="card">
                    <!-- عکس‌های جاکلیدی که اول فرستادید -->
                    <img src="path/to/keychain-image-1.jpg" alt="جاکلیدی">
                    <p>جاکلیدی طرح اول</p>
                </div>
                <div class="card">
                    <img src="path/to/keychain-image-2.jpg" alt="آویز کیف">
                    <p>آویز کیف طرح دوم</p>
                </div>
            </div>
        </div>

        <!-- بخش گوشواره -->
        <div id="earring-section" class="section">
            <h2>گوشواره</h2>
            <div class="grid">
                <div class="card">
                    <!-- عکس‌های گوشواره که فرستادید (قرار گرفته در انتهای بخش) -->
                    <img src="path/to/earring-image-1.jpg" alt="گوشواره">
                    <p>گوشواره مدل خاص</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // تابع برای نمایش خودکار بخش مربوطه بر اساس پارامتر آدرس (URL)
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function showCategory(catName) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            
            if (catName === 'keychain') {
                document.getElementById('keychain-section').classList.add('active');
            } else if (catName === 'earring') {
                document.getElementById('earring-section').classList.add('active');
            } else {
                // پیش‌فرض اگر پارامتری نبود
                document.getElementById('keychain-section').classList.add('active');
            }
        }

        // اجرای اولیه هنگام لود صفحه
        window.onload = function() {
            const currentCat = getQueryParam('cat');
            showCategory(currentCat || 'keychain');
        };
    </script>

</body>
</html>
