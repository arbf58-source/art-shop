<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه هنر و اکسسوری - منوی اصلی</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        header {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2rem;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .category-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            border-color: var(--primary-color);
        }

        .category-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .category-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            background-color: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
        }

        footer {
            margin-top: auto;
            padding: 40px 0 10px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>فروشگاه هنر و اکسسوری</h1>
        <p class="subtitle">لطفاً برای مشاهده محصولات، دسته‌بندی مورد نظر خود را انتخاب کنید</p>
    </header>

    <main class="container" id="categories-container">
        <!-- دسته‌بندی‌ها به صورت دینامیک بارگذاری می‌شوند -->
    </main>

    <footer>
        <p>تمامی حقوق محفوظ است.</p>
    </footer>

    <script>
        const categoriesInfo = [
            { key: 'necklaces', title: '✨ مجموعه‌ گردنبندها', count: '۲ محصول' },
            { key: 'bracelets', title: '💎 مجموعه‌ دستبندها', count: '۲ محصول' },
            { key: 'rings', title: '💍 مجموعه‌ انگشترها', count: '۲ محصول' },
            { key: 'accessory', title: '👑 مجموعه‌ اکسسوری', count: '۲ محصول' },
            { key: 'keychain', title: '🔑 مجموعه‌ جا کلیدی', count: '۲ محصول' },
            { key: 'clock-wall', title: '🖼️ تابلو و ساعت دیواری', count: '۲ محصول' },
            { key: 'anklet', title: '👣 مجموعه‌ پا بند', count: '۲ محصول' }
        ];

        function renderCategories() {
            const container = document.getElementById('categories-container');
            container.innerHTML = categoriesInfo.map(cat => `
                <a href="category.html?cat=${cat.key}" class="category-card">
                    <span class="category-title">${cat.title}</span>
                    <span class="category-count">${cat.count}</span>
                </a>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderCategories);
    </script>
</body>
</html>
